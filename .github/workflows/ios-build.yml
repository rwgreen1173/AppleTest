name: Build and Deploy to Appetize

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 1. Compiles the iOS binary within the shared architecture module
      - name: Build iOS Framework
        run: ./gradlew :shared:iosX64Binaries

      # 2. Dynamically isolates the framework folder and creates a standard ZIP package
      - name: Package Simulator App Bundle
        run: |
          echo "Searching for compiled iOS frameworks..."
          FRAMEWORK_PATH=$(find . -name "*.framework" -type d | head -n 1)
          
          if [ -z "$FRAMEWORK_PATH" ]; then
            echo "ERROR: Could not locate any compiled .framework folder inside the build outputs."
            exit 1
          fi
          
          echo "Found framework at: $FRAMEWORK_PATH"
          PARENT_DIR=$(dirname "$FRAMEWORK_PATH")
          FRAMEWORK_NAME=$(basename "$FRAMEWORK_PATH")
          
          cd "$PARENT_DIR"
          zip -r iosApp.zip "$FRAMEWORK_NAME"
          
          # Move the zip back to the root workspace directory for easy access
          mv iosApp.zip $GITHUB_WORKSPACE/iosApp.zip
          echo "Successfully created packed archive at root workspace."

      # 3. Securely pushes the valid zip package to Appetize using the correct API header
      - name: Upload to Appetize.io
        run: |
          curl -X POST https://api.appetize.io/v1/apps \
               -H "X-API-KEY: ${{ secrets.APPETIZE_API_TOKEN }}" \
               -F "file=@iosApp.zip" \
               -F "platform=ios"
