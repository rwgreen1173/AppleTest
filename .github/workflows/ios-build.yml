name: Build and Deploy to Appetize

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Compiles the simulator framework
      - name: Build Shared Framework
        run: ./gradlew :shared:iosX64Binaries

      # Builds the actual iOS .app bundle using xcodebuild
      - name: Build iOS Simulator App
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -derivedDataPath build-ios \
                     CODE_SIGNING_ALLOWED=NO

      # Zips the built .app package so Appetize can read it
      - name: Zip Simulator App
        run: |
          cd build-ios/Build/Products/Debug-iphonesimulator/
          zip -r iosApp.zip iosApp.app

      # Uploads the zip directly to your Appetize dashboard
      - name: Upload to Appetize.io
        run: |
          curl --request POST \
               --url "https://api.appetize.io/v1/apps" \
               --user "${{ secrets.APPETIZE_API_TOKEN }}:" \
               --form "file=@build-ios/Build/Products/Debug-iphonesimulator/iosApp.zip" \
               --form "platform=ios"
