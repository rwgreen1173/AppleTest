name: Build and Deploy to Appetize

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 1. Compiles the core Kotlin Multiplatform shared logic
      - name: Build Kotlin Shared Framework
        run: ./gradlew :shared:iosX64Binaries

      # 2. Compiles the actual user interface into a standalone simulator .app folder
      - name: Compile Native iOS Application
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -derivedDataPath build/ios

      # 3. Bundles the compiled simulator application folder into a clean ZIP archive
      - name: Package Simulator App Bundle
        run: |
          APP_PATH=$(find build/ios -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not locate compiled .app bundle inside build/ios outputs."
            exit 1
          fi
          
          echo "Found application bundle at: $APP_PATH"
          PARENT_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          
          cd "$PARENT_DIR"
          zip -r iosApp.zip "$APP_NAME"
          mv iosApp.zip $GITHUB_WORKSPACE/iosApp.zip
          echo "Successfully packaged application bundle."

      # 4. Securely pushes the valid application package directly to Appetize
      - name: Upload to Appetize.io
        run: |
          curl -X POST https://appetize.io \
               -H "X-API-KEY: ${{ secrets.APPETIZE_API_TOKEN }}" \
               -F "file=@iosApp.zip" \
               -F "platform=ios"
