name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14 # Uses a macOS environment with Xcode pre-installed
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    - name: Build iOS Framework / App
      run: ./gradlew :composeApp:iosX64Binaries # Compiles the iOS simulator binary
