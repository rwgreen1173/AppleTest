name: Build and Deploy to Appetize

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 1. Triggers the internal KMP packaging script to build the architecture binary target layout
      - name: Build and Package iOS Target
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          CONFIGURATION: Debug
          SDKROOT: iphonesimulator
          ARCHS: x86_64
          EXPANDED_CODE_SIGN_STYLE: Manual
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode

      # 2. Automatically isolates the nested standalone .app framework assets and packs them
      - name: Package Simulator App Bundle
        run: |
          echo "Searching for compiled application artifacts..."
          APP_PATH=$(find . -name "*.framework" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not locate compiled assets inside the build outputs."
            exit 1
          fi
          
          echo "Found artifact folder target at: $APP_PATH"
          PARENT_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          
          cd "$PARENT_DIR"
          zip -r iosApp.zip "$APP_NAME"
          mv iosApp.zip $GITHUB_WORKSPACE/iosApp.zip
          echo "Successfully packed executable application structure."

      # 3. Securely pushes the valid zipped package directory straight to your Appetize interface
      - name: Upload to Appetize.io
        run: |
          curl -X POST https://appetize.io \
               -H "X-API-KEY: ${{ secrets.APPETIZE_API_TOKEN }}" \
               -F "file=@iosApp.zip" \
               -F "platform=ios"
