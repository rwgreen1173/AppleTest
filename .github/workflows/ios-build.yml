name: Build and Deploy to Appetize

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 1. Compiles the actual visual application bundle for the iOS Simulator
      - name: Build iOS Simulator Application
        run: ./gradlew :app:iosX64DebugExecutable

      # 2. Automatically isolates the native .app container and zips it up
      - name: Package Simulator App Bundle
        run: |
          echo "Locating the generated KMP application bundle..."
          APP_PATH=$(find . -name "*.app" -type d | grep -v "Xcode" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not locate compiled .app bundles inside your project build outputs."
            exit 1
          fi
          
          echo "Found application bundle folder at: $APP_PATH"
          PARENT_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          
          cd "$PARENT_DIR"
          zip -r iosApp.zip "$APP_NAME"
          mv iosApp.zip $GITHUB_WORKSPACE/iosApp.zip
          echo "Successfully packed executable application structure."

      # 3. Securely pushes the valid target package directly to the correct API endpoint
      - name: Upload to Appetize.io
        run: |
          curl -X POST https://appetize.io \
               -H "X-API-KEY: ${{ secrets.APPETIZE_API_TOKEN }}" \
               -F "file=@iosApp.zip" \
               -F "platform=ios"
