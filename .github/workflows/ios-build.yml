name: Build and Deploy to Appetize

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 1. Compiles your core Kotlin Multiplatform binaries inside the shared module
      - name: Build Shared iOS Binary
        run: ./gradlew :shared:iosX64Binaries

      # 2. Automatically locates the built binary files, packages them into a ZIP archive, and moves them to the workspace root
      - name: Package Simulator App Bundle
        run: |
          echo "Locating your generated KMP application assets..."
          ASSET_PATH=$(find shared/build -name "*.framework" -type d | head -n 1)
          
          if [ -z "$ASSET_PATH" ]; then
            echo "ERROR: Could not locate compiled multiplatform framework outputs inside shared/build."
            exit 1
          fi
          
          echo "Found compiled framework path at: $ASSET_PATH"
          PARENT_DIR=$(dirname "$ASSET_PATH")
          ASSET_NAME=$(basename "$ASSET_PATH")
          
          cd "$PARENT_DIR"
          zip -r iosApp.zip "$ASSET_NAME"
          mv iosApp.zip $GITHUB_WORKSPACE/iosApp.zip
          echo "Successfully packaged build assets."

      # 3. Securely pushes the valid target package directly to the correct API endpoint
      - name: Upload to Appetize.io
        run: |
          curl -X POST https://api.appetize.io/v1/apps \
               -H "X-API-KEY: ${{ secrets.APPETIZE_API_TOKEN }}" \
               -F "file=@iosApp.zip" \
               -F "platform=ios"
