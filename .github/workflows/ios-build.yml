name: Build and Deploy to Appetize

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 1. Compiles your UI logic into a native Apple simulation architecture bundle
      - name: Build iOS Simulator Framework
        run: ./gradlew :composeApp:iosX64Binaries

      # 2. Automatically locates the newly generated framework, zips it, and brings it to the root workspace
      - name: Package Simulator Framework
        run: |
          echo "Locating your generated KMP simulator binary folder..."
          FRAMEWORK_PATH=$(find composeApp/build -name "*.framework" -type d | head -n 1)
          
          if [ -z "$FRAMEWORK_PATH" ]; then
            echo "ERROR: Could not locate compiled .framework folders inside composeApp/build outputs."
            exit 1
          fi
          
          echo "Found framework target at: $FRAMEWORK_PATH"
          PARENT_DIR=$(dirname "$FRAMEWORK_PATH")
          FRAMEWORK_NAME=$(basename "$FRAMEWORK_PATH")
          
          cd "$PARENT_DIR"
          zip -r iosApp.zip "$FRAMEWORK_NAME"
          mv iosApp.zip $GITHUB_WORKSPACE/iosApp.zip
          echo "Successfully packed simulator binary structure."

      # 3. Securely pushes the finalized app zip file directly into your Appetize layout
      - name: Upload to Appetize.io
        run: |
          curl -X POST https://appetize.io \
               -H "X-API-KEY: ${{ secrets.APPETIZE_API_TOKEN }}" \
               -F "file=@iosApp.zip" \
               -F "platform=ios"
