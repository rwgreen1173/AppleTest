name: Build and Deploy to Appetize

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Compiles the simulator application directory (.app)
      - name: Build iOS Simulator App
        run: ./gradlew :shared:iosX64Binaries


      # 2. Correctly packs the executable .app bundle (Not the raw framework)
      - name: Zip Simulator App Bundle
        run: |
          cd app/build/outputs/
          zip -r iosApp.zip *.app


      # 3. Securely pushes the valid zip package to Appetize using the correct API header
      - name: Upload to Appetize.io
        run: |
          curl -X POST https://api.appetize.io/v1/apps \
               -H "X-API-KEY: ${{ secrets.APPETIZE_API_TOKEN }}" \
               -F "file=@app/build/outputs/iosApp.zip" \
               -F "platform=ios"